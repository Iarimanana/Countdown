[package]
name = "countdown-setup"
description = "Offline installer for Countdown"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[[bin]]
name = "countdown-setup"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
winreg = "0.56.0"

[build-dependencies]
embed-resource = "3.0.12"
flate2 = "1.1.10"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }
tempfile = "3.27.0"
